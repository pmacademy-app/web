name: Notification Scheduler

on:
  schedule:
    # Process email queue every 15 minutes
    - cron: '*/15 * * * *'
    # Retry failed emails every hour
    - cron: '0 * * * *'
    # Weekly recap every Sunday at 18:00 UTC
    - cron: '0 18 * * 0'
    # Queue / log cleanup daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scheduled-tasks:
    runs-on: ubuntu-latest
    env:
      # Origin of the deployed app. `APP_URL` is a required GitHub Actions
      # secret (Repository Settings → Secrets and variables → Actions); the
      # fallback is the canonical production origin used across the app
      # (lib/brand.ts BRAND.siteUrl) so a missing secret fails loudly on the
      # endpoint instead of producing a malformed URL.
      CRON_ORIGIN: ${{ secrets.APP_URL || 'https://pmacademy.adityagangwani.me' }}
    steps:
      - name: Process Email Queue
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -X POST "$CRON_ORIGIN/api/cron/process-email-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Retry Failed Emails
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -X POST "$CRON_ORIGIN/api/cron/retry-failed" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Weekly Recap
        if: github.event.schedule == '0 18 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -X POST "$CRON_ORIGIN/api/cron/weekly-recap" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Cleanup Timeline & Logs
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -X POST "$CRON_ORIGIN/api/cron/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
