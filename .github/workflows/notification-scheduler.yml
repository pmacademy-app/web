name: Production Notification & Email Automation Scheduler

on:
  schedule:
    # 1. Process email queue & broadcasts every 5 minutes (24/7 continuous; handles retries automatically)
    - cron: '*/5 * * * *'
    # 2. Timezone-aware reminders & recaps run HOURLY. Since Phase T5, the daily-reminder
    #    and weekly-recap endpoints gate delivery on each user's LOCAL preferred hour
    #    (and, for recaps, local day of week). A once-daily/once-weekly trigger could only
    #    ever match the single timezone whose local window happened to coincide with the
    #    trigger instant, so every other user — including all default-preference users
    #    (UTC, reminder 09:00, recap Sunday 18:00) — was silently skipped. The per-user
    #    gate plus the local-date idempotency key make hourly invocation exactly-once.
    - cron: '30 * * * *'
    # 3. Queue / timeline / delivery log cleanup daily at 02:00 AM IST (20:30 UTC: 30 20 * * *)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Specific job to trigger (queue, broadcasts, retry, daily, weekly, cleanup, all)'
        required: false
        default: 'all'

permissions: {}

jobs:
  process-email-queue:
    name: Process Email Queue
    if: |
      github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job_to_run == 'all' || inputs.job_to_run == 'queue')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: email-queue-runner
      cancel-in-progress: false
    steps:
      - name: Trigger Process Queue Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.adityagangwani.me}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/process-email-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  process-broadcasts:
    name: Process Scheduled Broadcasts
    if: |
      github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job_to_run == 'all' || inputs.job_to_run == 'broadcasts')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: broadcast-runner
      cancel-in-progress: false
    steps:
      - name: Trigger Process Broadcasts Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.adityagangwani.me}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X GET "${SITE_URL}/api/cron/process-broadcasts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  # DEPRECATED (Phase T5): /api/cron/process-email-queue handles all retries continuously every 5 minutes.
  # Retained solely for manual diagnostic invocation.
  retry-failed-emails:
    name: Retry Failed Emails (Deprecated)
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job_to_run == 'retry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Retry Failed Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.adityagangwani.me}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/retry-failed" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  daily-reminder:
    name: Queue Daily Reminders
    if: |
      github.event_name == 'schedule' && github.event.schedule == '30 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job_to_run == 'all' || inputs.job_to_run == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Daily Reminder Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.adityagangwani.me}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/daily-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  weekly-recap:
    name: Queue Weekly Recaps
    # Runs hourly on the same '30 * * * *' trigger as daily reminders. The endpoint gates
    # each user on their LOCAL day-of-week AND local hour, so hourly invocation dispatches
    # exactly one recap per user per week (in their local Sunday-18:00-by-default window),
    # deduplicated by the weekly-recap-<user>-<localDate> idempotency key.
    if: |
      github.event_name == 'schedule' && github.event.schedule == '30 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job_to_run == 'all' || inputs.job_to_run == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Weekly Recap Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.adityagangwani.me}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/weekly-recap" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  cleanup-logs:
    name: Cleanup Timeline & Delivery Logs
    if: |
      github.event_name == 'schedule' && github.event.schedule == '30 20 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.job_to_run == 'all' || inputs.job_to_run == 'cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cleanup Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.adityagangwani.me}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
