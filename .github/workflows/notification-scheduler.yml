name: Production Notification & Email Automation Scheduler

on:
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Specific job to trigger (queue, broadcasts, retry, daily, weekly, lifecycle, cleanup, all)'
        required: false
        default: 'all'

permissions: {}

jobs:
  process-email-queue:
    name: Process Email Queue
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'queue'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: email-queue-runner
      cancel-in-progress: false
    steps:
      - name: Trigger Process Queue Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/process-email-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  process-broadcasts:
    name: Process Scheduled Broadcasts
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'broadcasts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: broadcast-runner
      cancel-in-progress: false
    steps:
      - name: Trigger Process Broadcasts Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/process-broadcasts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  # DEPRECATED (Phase T5): /api/cron/process-email-queue handles all retries continuously every 5 minutes.
  # Retained solely for manual diagnostic invocation.
  retry-failed-emails:
    name: Retry Failed Emails (Deprecated)
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'retry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Retry Failed Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/retry-failed" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  daily-reminder:
    name: Queue Daily Reminders
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Daily Reminder Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/daily-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  weekly-recap:
    name: Queue Weekly Recaps
    # Invoked manually via workflow_dispatch. In production, pg_cron is the scheduler.
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Weekly Recap Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/weekly-recap" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  lifecycle-sequences:
    name: Queue Lifecycle Reactivation Sequences
    # Invoked manually via workflow_dispatch. In production, pg_cron is the scheduler.
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Lifecycle Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/lifecycle" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  cleanup-logs:
    name: Cleanup Timeline & Delivery Logs
    if: inputs.job_to_run == 'all' || inputs.job_to_run == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cleanup Endpoint
        run: |
          RAW_URL="${{ secrets.PRODUCTION_SITE_URL || secrets.APP_URL }}"
          SITE_URL="${RAW_URL:-https://prodily.app}"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body -s -S -X POST "${SITE_URL}/api/cron/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
