name: PM Academy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
      # Turnstile. NEXT_PUBLIC_TURNSTILE_SITE_KEY is inlined into the client bundle at
      # build time, so `next.config.ts` refuses to produce a production build without
      # it — a bundle with no site key ships a signup page whose challenge never
      # renders. CI is a verification build that is never served, so it falls back to
      # Cloudflare's published always-pass TEST keys rather than requiring the real
      # ones. These are documented public dummies, not credentials: the site key is
      # visible in every page that uses it, and the secret only ever validates the
      # matching dummy token. Vercel supplies the real values for deployed builds, and
      # the guard still fails there if they are ever missing.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Environment Presence (Safe Check)
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "✓ NEXT_PUBLIC_SUPABASE_URL is configured in CI environment"
          else
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL is not set in CI environment"
          fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "✓ SUPABASE_SERVICE_ROLE_KEY is configured in CI environment"
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set in CI environment"
          fi

      - name: Parse & validate content pipeline
        run: npm run content:build

      - name: Type check & Lint
        run: |
          npm run lint
          npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Brand hardening check
        run: |
          set -e
          # 1. No hardcoded brand URL outside the brand config and test fixtures.
          if grep -rn "https://pmacademy.com" --include="*.ts" --include="*.tsx" . \
            | grep -v "lib/brand.ts" | grep -v "lib/__tests__/"; then
            echo "::error::Hardcoded brand URL found — source from lib/brand.ts (BRAND.siteUrl) instead."
            exit 1
          fi
          # 2. No legacy title-suffix pattern — the root layout template already appends the brand.
          if grep -rn "| PM Academy'" --include="*.tsx" app/; then
            echo "::error::Legacy '| PM Academy' title suffix found — strip it; the root layout title.template appends the brand."
            exit 1
          fi
          # 3. No base64 data-URI wrapper SVGs — assets must be real, lightweight vector files
          #    regenerated from docs/design/assets/logo.png via `npm run brand:generate`.
          if grep -rln "data:image/png;base64" --include="*.svg" public/; then
            echo "::error::Base64 data-URI SVG found in public/ — run 'npm run brand:generate' to emit real vector assets."
            exit 1
          fi
          # 4. No hardcoded brand hex values outside the design token source of truth.
          if grep -rn -i -e "#1f6b4e" -e "#fbfaf6" -e "#171a17" -e "#d98b24" --include="*.ts" --include="*.tsx" app/ components/ lib/ blocks/ renderer/ \
            | grep -v "theme/tokens.ts"; then
            echo "::error::Hardcoded brand color found — source from theme/tokens.ts (TOKENS) or lib/brand.ts (BRAND) instead."
            exit 1
          fi

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

  # Dependency and secret gates (B14-B). Deliberately a separate job from
  # build-and-validate: a security finding must be visible on its own line in the
  # checks list rather than buried in a build log, and it must not be able to
  # silently hold back a migration deploy that is otherwise correct. Nothing here
  # is advisory-only — both steps fail the job when they find something.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` on purpose. `npm audit` resolves entirely from the committed
      # lockfile, so this job installs nothing and therefore executes no
      # third-party install script — the smallest possible footprint for a job
      # whose whole purpose is to distrust the dependency tree.
      - name: Dependency audit gate
        run: node --experimental-strip-types scripts/ci/audit-gate.ts

      # Pinned by version and verified by checksum: an unpinned scanner is a
      # supply-chain hole in the control that exists to find supply-chain holes.
      # The official gitleaks action is not used because it requires an
      # organisation licence key; the released binary has no such requirement.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps a discovered secret out of the public build log; the
      # finding still names the file, line and rule, which is what a responder
      # needs. Exit code 1 on any finding.
      - name: Secret scan
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

  # Applies pending migrations in supabase/migrations/ to the linked project.
  #
  # This job previously guarded its only step with
  #   if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
  # which made a missing secret indistinguishable from a successful deploy: the step
  # was skipped, the job reported success, and nothing said the schema had not moved.
  # F-REL-7 / B14-A. Credential presence is now asserted in its own step that FAILS,
  # and the applied state is verified after the push rather than assumed.
  deploy-supabase:
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Secrets reach the scripts as environment variables rather than as `${{ }}`
      # interpolations inside `run:` bodies, so no secret is substituted into the
      # rendered script text. SUPABASE_ACCESS_TOKEN is read by the CLI directly.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail loudly rather than skipping. A migration job that silently does nothing is
      # worse than one that fails: the schema the application expects is simply absent,
      # and every downstream check reads green.
      - name: Assert Supabase deployment credentials are present
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_PROJECT_ID:-}" ]   || missing="${missing} SUPABASE_PROJECT_ID"
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]  || missing="${missing} SUPABASE_DB_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error title=Supabase migration deploy cannot run::Missing repository secret(s):${missing}. Migrations in supabase/migrations/ were NOT applied. Configure these secrets, then re-run this workflow. Do not treat this run as deployed."
            exit 1
          fi
          echo "✓ All three Supabase deployment secrets are present."

      - name: Link Supabase project
        run: |
          set -euo pipefail
          npx supabase link --project-ref "${SUPABASE_PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}" --yes

      # Recorded before and after so a run's log answers "what did this change?" without
      # anyone needing production access.
      - name: Migration state BEFORE push
        run: |
          set -euo pipefail
          npx supabase migration list --linked

      - name: Push pending migrations
        run: |
          set -euo pipefail
          npx supabase db push --password "${SUPABASE_DB_PASSWORD}"

      - name: Migration state AFTER push
        run: |
          set -euo pipefail
          npx supabase migration list --linked

      # The push above exits non-zero on failure, but a partial or no-op apply would
      # still pass. A dry run is the CLI's own answer to "is anything still pending?",
      # so the job only succeeds when the remote schema actually matches the repository.
      - name: Verify no migrations remain pending
        run: |
          set -euo pipefail
          output="$(npx supabase db push --dry-run --password "${SUPABASE_DB_PASSWORD}" 2>&1)"
          echo "${output}"
          # `upToDate` is a structured field in the CLI's JSON output and is the primary
          # signal; the prose forms are accepted as a fallback across CLI versions.
          if echo "${output}" | grep -qE '"upToDate"[[:space:]]*:[[:space:]]*true'; then
            echo "✓ Remote schema matches supabase/migrations/."
            exit 0
          fi
          if echo "${output}" | grep -qiE 'Remote database is up to date|no migrations to apply'; then
            echo "✓ Remote schema matches supabase/migrations/."
            exit 0
          fi
          echo "::error title=Migrations still pending after push::supabase db push --dry-run did not report the remote database as up to date. The deploy may be partial. Review the migration state output above before treating this deploy as complete."
          exit 1
