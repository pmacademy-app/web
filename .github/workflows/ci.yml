name: PM Academy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Environment Presence (Safe Check)
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "✓ NEXT_PUBLIC_SUPABASE_URL is configured in CI environment"
          else
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL is not set in CI environment"
          fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "✓ SUPABASE_SERVICE_ROLE_KEY is configured in CI environment"
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set in CI environment"
          fi

      - name: Parse & validate content pipeline
        run: npm run content:build

      - name: Type check & Lint
        run: |
          npm run lint
          npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Brand hardening check
        run: |
          set -e
          # 1. No hardcoded brand URL outside the brand config and test fixtures.
          if grep -rn "https://pmacademy.com" --include="*.ts" --include="*.tsx" . \
            | grep -v "lib/brand.ts" | grep -v "lib/__tests__/"; then
            echo "::error::Hardcoded brand URL found — source from lib/brand.ts (BRAND.siteUrl) instead."
            exit 1
          fi
          # 2. No legacy title-suffix pattern — the root layout template already appends the brand.
          if grep -rn "| PM Academy'" --include="*.tsx" app/; then
            echo "::error::Legacy '| PM Academy' title suffix found — strip it; the root layout title.template appends the brand."
            exit 1
          fi
          # 3. No base64 data-URI wrapper SVGs — assets must be real, lightweight vector files
          #    regenerated from docs/design/assets/logo.png via `npm run brand:generate`.
          if grep -rln "data:image/png;base64" --include="*.svg" public/; then
            echo "::error::Base64 data-URI SVG found in public/ — run 'npm run brand:generate' to emit real vector assets."
            exit 1
          fi
          # 4. No hardcoded brand hex values outside the design token source of truth.
          if grep -rn -i -e "#1f6b4e" -e "#fbfaf6" -e "#171a17" -e "#d98b24" --include="*.ts" --include="*.tsx" app/ components/ lib/ blocks/ renderer/ \
            | grep -v "theme/tokens.ts"; then
            echo "::error::Hardcoded brand color found — source from theme/tokens.ts (TOKENS) or lib/brand.ts (BRAND) instead."
            exit 1
          fi

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

  deploy-supabase:
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Link Project & Deploy Migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --yes
          npx supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
