name: PM Academy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    # Job-level env reaches every step, including third-party install scripts, so
    # only public values live here. SEC-10: no step in this job gets the Supabase
    # service-role key, the Resend key, the cron secret or the email hook secret.
    #   - Unit tests: vitest.setup.ts forces mock Supabase values and a test cron
    #     secret, and suites that need the email secrets set their own.
    #   - next build: a CI build is never served. The build-time readers of the
    #     service-role key (app/sitemap.ts, TestimonialsService) fall back to an
    #     empty list when it is absent, and the email and cron secrets are only read
    #     by request handlers at runtime.
    # The two NEXT_PUBLIC_ Supabase values are inlined into the client bundle, so
    # they are public by design and stay here for the build.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Turnstile. NEXT_PUBLIC_TURNSTILE_SITE_KEY is inlined into the client bundle at
      # build time, so `next.config.ts` refuses to produce a production build without
      # it — a bundle with no site key ships a signup page whose challenge never
      # renders. CI is a verification build that is never served, so it falls back to
      # Cloudflare's published always-pass TEST keys rather than requiring the real
      # ones. These are documented public dummies, not credentials: the site key is
      # visible in every page that uses it, and the secret only ever validates the
      # matching dummy token. Vercel supplies the real values for deployed builds, and
      # the guard still fails there if they are ever missing.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      # SEC-20: no install script runs during the install. Only the packages in the
      # lockfile that declare one (`hasInstallScript`) are rebuilt, by name:
      # esbuild and unrs-resolver (both `postinstall`). fsevents also declares one
      # but is a macOS-only optional dependency that is never installed here.
      # Re-check this list when the lockfile gains a new `hasInstallScript` entry.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild unrs-resolver

      # The step gets a true/false flag, never the key itself.
      - name: Verify Environment Presence (Safe Check)
        env:
          HAS_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "✓ NEXT_PUBLIC_SUPABASE_URL is configured in CI environment"
          else
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL is not set in CI environment"
          fi
          if [ "$HAS_SERVICE_ROLE_KEY" = "true" ]; then
            echo "✓ SUPABASE_SERVICE_ROLE_KEY is configured in CI environment"
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set in CI environment"
          fi

      - name: Parse & validate content pipeline
        run: npm run content:build

      - name: Type check & Lint
        run: |
          npm run lint
          npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Accessibility Gate (B11-C axe-core)
        run: npm run test:a11y

      - name: Brand hardening check
        run: |
          set -e
          # 1. No hardcoded brand URL outside the brand config and test fixtures.
          if grep -rn "https://pmacademy.com" --include="*.ts" --include="*.tsx" . \
            | grep -v "lib/brand.ts" | grep -v "lib/__tests__/"; then
            echo "::error::Hardcoded brand URL found — source from lib/brand.ts (BRAND.siteUrl) instead."
            exit 1
          fi
          # 2. No legacy title-suffix pattern — the root layout template already appends the brand.
          if grep -rn "| PM Academy'" --include="*.tsx" app/; then
            echo "::error::Legacy '| PM Academy' title suffix found — strip it; the root layout title.template appends the brand."
            exit 1
          fi
          # 3. No base64 data-URI wrapper SVGs — assets must be real, lightweight vector files
          #    regenerated from docs/design/assets/logo.png via `npm run brand:generate`.
          if grep -rln "data:image/png;base64" --include="*.svg" public/; then
            echo "::error::Base64 data-URI SVG found in public/ — run 'npm run brand:generate' to emit real vector assets."
            exit 1
          fi
          # 4. No hardcoded brand hex values outside the design token source of truth.
          if grep -rn -i -e "#1f6b4e" -e "#fbfaf6" -e "#171a17" -e "#d98b24" --include="*.ts" --include="*.tsx" app/ components/ lib/ blocks/ renderer/ \
            | grep -v "theme/tokens.ts"; then
            echo "::error::Hardcoded brand color found — source from theme/tokens.ts (TOKENS) or lib/brand.ts (BRAND) instead."
            exit 1
          fi

      - name: Next.js Production Build
        run: npm run build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
          include-hidden-files: true
          retention-days: 1

  # Critical-path E2E (B14-C). A separate job from build-and-validate for two reasons.
  #
  # Cost: E2E installs a browser and boots the production server, and the roadmap is
  # explicit that CI time grows — "run E2E on `main` and on PRs touching auth". It used
  # to run on every push of every PR, including documentation-only ones. The gate below
  # keeps it on `main` and on the changes it actually protects.
  #
  # Visibility: an E2E failure should be its own line in the checks list rather than the
  # last step of a job that has already done a build, so it is obvious what broke.
  #
  # The two flows this runs — signup → verify → first lesson → XP, and login → session
  # persistence → protected route → logout — are write-heavy. They self-skip with a
  # stated reason unless E2E_ALLOW_WRITES and staging credentials are present, and
  # `e2e/support/env.ts` refuses outright to run against the production host. The
  # remaining specs need no account and run here on every triggered build.
  e2e:
    needs: [build-and-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Public values only at job level (SEC-10). The one sensitive secret this job
    # needs is set on the step that starts the server; see "Run critical-path E2E".
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # The same published always-pass Turnstile dummies the build job documents. The
      # signup spec depends on them: without a solvable challenge the form never submits.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
      # Staging only, and only when configured. Absent, the write flows skip rather than
      # fail — a red E2E job nobody can act on is worse than one that says why it idled.
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ALLOW_WRITES: ${{ secrets.E2E_ALLOW_WRITES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The auth-path filter diffs against the base branch, which needs its history.
          fetch-depth: 0

      # Decides whether this run exercises the critical paths. `main` always does.
      # A pull request does when it touches auth, the session model, the proxy, the
      # specs themselves, or the dependency lockfile.
      - name: Decide whether E2E runs
        id: decide
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running the critical paths."
            exit 0
          fi
          base="origin/${GITHUB_BASE_REF}"
          git fetch --no-tags --depth=0 origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
          changed="$(git diff --name-only "${base}...HEAD" || true)"
          echo "Changed files:"; echo "${changed}"
          if echo "${changed}" | grep -qE '^apps/web/(app/\(auth\)/|app/api/auth/|app/api/user/|lib/auth/|lib/api/actor|lib/admin-site\.ts|app/api/internal/|lib/security/origin-check|proxy\.ts|e2e/|playwright\.config\.ts|package-lock\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Auth-relevant paths changed — running the critical paths."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No auth-relevant paths changed — skipping E2E for this pull request."
          fi

      - name: Setup Node.js
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        working-directory: ./apps/web
        # Same install policy as build-and-validate: no install scripts, then
        # rebuild only the packages that declare one.
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild unrs-resolver

      - name: Parse & validate content pipeline
        if: steps.decide.outputs.run == 'true'
        working-directory: ./apps/web
        run: npm run content:build

      - name: Install Playwright Browsers
        if: steps.decide.outputs.run == 'true'
        working-directory: ./apps/web
        run: npx playwright install --with-deps chromium

      # Only built when no external base URL is supplied; with one, the specs run
      # against that deployment and Playwright's webServer is not used.
      # Download prebuilt Next.js artifact from build-and-validate to eliminate redundant build
      - name: Download Next.js build artifact
        if: steps.decide.outputs.run == 'true' && env.PLAYWRIGHT_TEST_BASE_URL == ''
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: apps/web/.next

      # Playwright's webServer starts `next start` inside this step, so the server's
      # runtime secrets belong here and nowhere else in the job. It needs the
      # service-role key for its API routes. It does not get the Resend key (email
      # falls back to a console log), the cron secret (no spec calls a cron route)
      # or the email hook secret (Supabase never calls this CI server's hook).
      - name: Run critical-path E2E
        if: steps.decide.outputs.run == 'true'
        working-directory: ./apps/web
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  # Dependency and secret gates (B14-B). Deliberately a separate job from
  # build-and-validate: a security finding must be visible on its own line in the
  # checks list rather than buried in a build log, and it must not be able to
  # silently hold back a migration deploy that is otherwise correct. Nothing here
  # is advisory-only — both steps fail the job when they find something.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` on purpose. `npm audit` resolves entirely from the committed
      # lockfile, so this job installs nothing and therefore executes no
      # third-party install script — the smallest possible footprint for a job
      # whose whole purpose is to distrust the dependency tree.
      - name: Dependency audit gate
        run: node --experimental-strip-types scripts/ci/audit-gate.ts

      # Pinned by version and verified by checksum: an unpinned scanner is a
      # supply-chain hole in the control that exists to find supply-chain holes.
      # The official gitleaks action is not used because it requires an
      # organisation licence key; the released binary has no such requirement.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps a discovered secret out of the public build log; the
      # finding still names the file, line and rule, which is what a responder
      # needs. Exit code 1 on any finding.
      - name: Secret scan
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

  # Replays migrations against a local Postgres instance, applies safe held
  # migrations, runs the grant allowlist test, and verifies database types. (AG-04)
  db-local:
    name: Local Database Replay and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: '3.1.0'

      - name: Start local Supabase
        run: |
          supabase start

      - name: Reset local database
        run: |
          supabase db reset

      - name: Apply held migrations
        run: |
          bash scripts/ci/apply-held-migrations.sh

      - name: Run grant allowlist test
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/grant_allowlist.sql

      - name: Run pgTAP database tests
        run: |
          supabase test db

      - name: Check database types drift
        run: |
          bash scripts/ci/check-db-types-drift.sh

  # Applies pending migrations in supabase/migrations/ to the linked project.
  #
  # This job previously guarded its only step with
  #   if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
  # which made a missing secret indistinguishable from a successful deploy: the step
  # was skipped, the job reported success, and nothing said the schema had not moved.
  # F-REL-7 / B14-A. Credential presence is now asserted in its own step that FAILS,
  # and the applied state is verified after the push rather than assumed.
  deploy-supabase:
    needs: [build-and-validate, db-local]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Secrets reach the scripts as environment variables rather than as `${{ }}`
      # interpolations inside `run:` bodies, so no secret is substituted into the
      # rendered script text. SUPABASE_ACCESS_TOKEN is read by the CLI directly.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-cli v3 installs the CLI from npm and needs Node.js 20 or newer.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # SEC-20: the CLI that writes to production is pinned, not fetched from npm
      # at whatever version is newest on the day. The action is pinned to a commit
      # SHA. The flags below (`--linked` plus `--yes`, commit 777c36a) were adapted
      # to CLI v3, and 3.1.0 is the npm `latest` the old unpinned call resolved to
      # when this pin was set, so the deploy behaves as before. Bump `version:` on
      # purpose, after reading the CLI release notes, never by drift.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: '3.1.0'

      # Fail loudly rather than skipping. A migration job that silently does nothing is
      # worse than one that fails: the schema the application expects is simply absent,
      # and every downstream check reads green.
      - name: Assert Supabase deployment credentials are present
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_PROJECT_ID:-}" ]   || missing="${missing} SUPABASE_PROJECT_ID"
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]  || missing="${missing} SUPABASE_DB_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error title=Supabase migration deploy cannot run::Missing repository secret(s):${missing}. Migrations in supabase/migrations/ were NOT applied. Configure these secrets, then re-run this workflow. Do not treat this run as deployed."
            exit 1
          fi
          echo "✓ All three Supabase deployment secrets are present."

      - name: Link Supabase project
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}" --yes

      # Recorded before and after so a run's log answers "what did this change?" without
      # anyone needing production access.
      - name: Migration state BEFORE push
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Push pending migrations
        run: |
          set -euo pipefail
          supabase db push --include-all --linked --password "${SUPABASE_DB_PASSWORD}" --yes

      - name: Migration state AFTER push
        run: |
          set -euo pipefail
          supabase migration list --linked

      # The push above exits non-zero on failure, but a partial or no-op apply would
      # still pass. A dry run is the CLI's own answer to "is anything still pending?",
      # so the job only succeeds when the remote schema actually matches the repository.
      - name: Verify no migrations remain pending
        run: |
          set -euo pipefail
          output="$(supabase db push --include-all --linked --dry-run --password "${SUPABASE_DB_PASSWORD}" 2>&1)"
          echo "${output}"
          # `upToDate` is a structured field in the CLI's JSON output and is the primary
          # signal; the prose forms are accepted as a fallback across CLI versions.
          if echo "${output}" | grep -qE '"upToDate"[[:space:]]*:[[:space:]]*true'; then
            echo "✓ Remote schema matches supabase/migrations/."
            exit 0
          fi
          if echo "${output}" | grep -qiE 'Remote database is up to date|no migrations to apply'; then
            echo "✓ Remote schema matches supabase/migrations/."
            exit 0
          fi
          echo "::error title=Migrations still pending after push::supabase db push --dry-run did not report the remote database as up to date. The deploy may be partial. Review the migration state output above before treating this deploy as complete."
          exit 1

  # Deploys prebuilt Next.js application to Vercel production after database migrations
  # have applied cleanly. (ENG-06 / AG-07)
  deploy-vercel:
    name: Deploy Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-supabase]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert Vercel deployment credentials are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VERCEL_TOKEN:-}" ]      || missing="${missing} VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID:-}" ]    || missing="${missing} VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing="${missing} VERCEL_PROJECT_ID"
          if [ -n "${missing}" ]; then
            echo "::error title=Vercel production deploy cannot run::Missing repository secret(s):${missing}. Production was NOT deployed. Configure these secrets, then re-run this workflow."
            exit 1
          fi
          echo "✓ All three Vercel deployment secrets are present."

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@65.16.0 pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@65.16.0 build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy Prebuilt Artifacts to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@65.16.0 deploy --prebuilt --prod --token="${VERCEL_TOKEN}"

      - name: Verify Deployment Health
        run: |
          set -euo pipefail
          curl --fail --show-error --retry 5 --retry-delay 5 https://prodily.app/api/health
