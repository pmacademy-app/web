name: PM Academy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Link root node_modules for scripts
        run: ln -s $GITHUB_WORKSPACE/apps/web/node_modules $GITHUB_WORKSPACE/node_modules

      - name: Parse & validate content pipeline
        run: npm run content:build

      - name: Type check & Lint
        run: npm run lint

      - name: Next.js Production Build
        run: npm run build
