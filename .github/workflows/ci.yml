name: PM Academy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the GitHub actions UI

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Link root node_modules for scripts
        run: ln -s $GITHUB_WORKSPACE/apps/web/node_modules $GITHUB_WORKSPACE/node_modules

      - name: Parse & validate content pipeline
        run: npm run content:build

      - name: Type check & Lint
        run: npm run lint

      - name: Brand hardening check
        run: |
          set -e
          # 1. No hardcoded brand URL outside the brand config and test fixtures.
          if grep -rn "https://pmacademy.com" --include="*.ts" --include="*.tsx" . \
            | grep -v "lib/brand.ts" | grep -v "lib/__tests__/"; then
            echo "::error::Hardcoded brand URL found — source from lib/brand.ts (BRAND.siteUrl) instead."
            exit 1
          fi
          # 2. No legacy title-suffix pattern — the root layout template already appends the brand.
          if grep -rn "| PM Academy'" --include="*.tsx" app/; then
            echo "::error::Legacy '| PM Academy' title suffix found — strip it; the root layout title.template appends the brand."
            exit 1
          fi
          # 3. No base64 data-URI wrapper SVGs — assets must be real, lightweight vector files
          #    regenerated from docs/design/assets/logo.png via `npm run brand:generate`.
          if grep -rln "data:image/png;base64" --include="*.svg" public/; then
            echo "::error::Base64 data-URI SVG found in public/ — run 'npm run brand:generate' to emit real vector assets."
            exit 1
          fi
          # 4. No hardcoded brand hex values outside the design token source of truth.
          if grep -rn -i -e "#1f6b4e" -e "#fbfaf6" -e "#171a17" -e "#d98b24" --include="*.ts" --include="*.tsx" app/ components/ lib/ blocks/ renderer/ \
            | grep -v "theme/tokens.ts"; then
            echo "::error::Hardcoded brand color found — source from theme/tokens.ts (TOKENS) or lib/brand.ts (BRAND) instead."
            exit 1
          fi

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-service-role-key' }}
          NEXT_PUBLIC_SITE_URL: 'https://prodily.adityagangwani.me'

  deploy-supabase:
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_ACCESS_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link Project
        run: npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Migrations
        run: npx supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
