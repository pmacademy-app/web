# Dependabot keeps the dependency and workflow-action surfaces current so the CI
# audit gate (scripts/ci/audit-gate.ts) has something to converge on rather than an
# allowlist that only ever grows.
#
# Three ecosystems, matching the three things that are actually installed:
#   - apps/web         the application dependency tree and its lockfile
#   - /                the monorepo root manifest (scripts only, no lockfile of its own)
#   - github-actions   the action versions pinned in .github/workflows/
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Patch and minor noise is grouped into one PR per week; majors stay separate so
    # each one gets its own review and regression run. The vitest group below is the
    # deliberate exception — see the note on it.
    groups:
      # Listed first so it claims these packages before the broader development
      # group can. vitest and its @vitest/* companions peer-pin each other to an
      # exact version (@vitest/coverage-v8@5.0.0 requires vitest@5.0.0, not a
      # range), so whichever one moves alone leaves a tree `npm ci` cannot resolve.
      # PR #26 was precisely that: a lone @vitest/coverage-v8 4.1.11 -> 5.0.0 bump
      # that failed at install and took build-and-validate and e2e down with it
      # before a single test ran.
      #
      # No `update-types` filter on purpose. Majors are the breaking case here, so
      # they have to travel together too — narrowing this group to minor/patch
      # would leave the exact failure it exists to prevent.
      vitest-ecosystem:
        # Explicit rather than implied. `version-updates` is the default, so this
        # is a no-op on its own — but with a security-update twin directly below,
        # leaving one of the pair unstated is how someone later misreads which
        # group covers what.
        applies-to: "version-updates"
        patterns:
          - "vitest"
          - "@vitest/*"
      # Security updates are a separate track: they ignore the version-update
      # groups entirely and would otherwise be raised one package at a time. An
      # advisory against @vitest/coverage-v8 alone would then rebuild the exact
      # peer break this file exists to prevent — patched coverage package, stale
      # vitest, unresolvable tree — except arriving as a security PR nobody wants
      # to sit on. Same patterns, same reasoning, other track.
      vitest-ecosystem-security:
        applies-to: "security-updates"
        patterns:
          - "vitest"
          - "@vitest/*"
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        # Redundant with the ordering above, but it makes the precedence explicit
        # instead of resting on YAML key order, which the spec calls unordered.
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
